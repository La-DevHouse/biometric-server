# Postgres local para desarrollo y `npm test`. NO es la infra de producción
# (eso es el servicio `postgres-alco` en Coolify — ver docs/06-infrastructure.md).
#
#   docker compose up -d db      # levanta el motor (vacío la primera vez)
#   npm run db:migrate           # aplica las migraciones de prisma/migrations
#   docker compose down          # detiene; los datos quedan en el volumen
#   docker compose down -v       # detiene y BORRA los datos

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: biometric
      POSTGRES_DB: biometric
    # host 55432 (no 5432) para no chocar con otros contenedores Postgres locales
    ports:
      - "55432:5432"
    volumes:
      - biometric_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometric -d biometric"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  biometric_pgdata:
